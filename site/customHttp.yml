customHeaders:
  # embed.js is the product every integrating site loads directly; its
  # filename carries no content hash, so a stale CDN edge serves an old
  # copy indefinitely with no way for an integrator to detect it. Amplify
  # Hosting's own default for static public/ assets is effectively a
  # one-year edge cache (s-maxage) with no invalidation step anywhere in
  # this repo's deploy pipeline -- confirmed live: several consecutive
  # fixes shipped this week were invisible on some CloudFront edges for
  # hours because of this. A short s-maxage means an edge naturally picks
  # up new bytes within a minute of the next deploy, with zero deploy-time
  # action required. See auritus-6df2ac (kanbus).
  - pattern: '/embed.js'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, s-maxage=60, must-revalidate'
