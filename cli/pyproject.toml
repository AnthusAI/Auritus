[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auritus"
version = "0.27.0"
description = "Open-source just-in-time TTS embed for web pages."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anthus AI" }]
dependencies = [
  "typer>=0.12.0",
  "httpx>=0.27.0",
  "tomli>=2.0.0; python_version < '3.11'",
  "tomli-w>=1.0.0",
  "boto3>=1.34.0",
]

[project.optional-dependencies]
# One extra per speech backend: its model stack for PyTorch/CUDA, plus mlx-audio
# on Apple Silicon. The Batch worker image pins exact versions per backend in
# worker-image/requirements*.txt instead.
kokoro = ["kokoro>=0.9.4", "torch>=2.5", "soundfile>=0.12", "numpy>=1.26", "mlx-audio>=0.5.0; sys_platform == 'darwin' and platform_machine == 'arm64'"]
qwen = ["qwen-tts>=0.1.1", "torch>=2.5", "soundfile>=0.12", "numpy>=1.26", "mlx-audio>=0.5.0; sys_platform == 'darwin' and platform_machine == 'arm64'"]
f5 = [
  "f5-tts>=1.1.22",
  "torch>=2.5",
  "torchaudio>=2.5",
  "soundfile>=0.12",
  "numpy>=1.26",
  "mlx-audio>=0.5.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "f5-tts-mlx; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
chatterbox = [
  "chatterbox-tts>=0.1.7",
  "torch>=2.5",
  "torchaudio>=2.5",
  "soundfile>=0.12",
  "numpy>=1.26",
  "mlx-audio>=0.5.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
fish = [
  "fish-speech",
  "huggingface-hub",
  "hydra-core",
  "pyrootutils",
  "safetensors",
  "torch>=2.5",
  "torchaudio>=2.5",
  "soundfile>=0.12",
  "numpy>=1.26",
  "mlx-audio>=0.5.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
higgs = [
  "transformers>=5.5.0",
  "huggingface-hub",
  "torch>=2.5",
  "torchaudio>=2.5",
  "soundfile>=0.12",
  "numpy>=1.26",
  "mlx-audio>=0.5.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dev = [
  "behave>=1.2.6",
  "pytest>=8.0",
  "numpy>=1.24",  # tests build audio arrays for the Kokoro break joiner
  "ruff==0.15.5",  # pinned: new releases add default rules and redden CI
  "black==26.3.1",  # pinned with ruff so formatting cannot drift
  "build>=1.2.2",
  "python-semantic-release>=10.5.3",
  "moto>=5.0.0",
]

[project.scripts]
auritus = "auritus.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The default reference clip for F5 and Fish voice cloning.
auritus = ["tts/*.wav"]

[tool.ruff]
line-length = 88
# B008: typer.Option() in defaults is the standard Typer pattern, not a bug

[tool.ruff.lint]
# B008: typer.Option() in defaults is the standard Typer pattern, not a bug
# F401: behave step files use cross-step imports that ruff sees as unused
ignore = ["B008", "F401"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.semantic_release]
allow_zero_version = true
build_command = "python -m build"
commit_parser = "conventional"
upload_to_pypi = true
upload_to_vcs_release = true
version_toml = [
  "pyproject.toml:project.version",
]
version_variables = [
  "src/auritus/__init__.py:__version__",
]

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
