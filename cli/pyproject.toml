[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auritus"
version = "0.13.0"
description = "Open-source just-in-time TTS embed for web pages."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anthus AI" }]
dependencies = [
  "typer>=0.12.0",
  "httpx>=0.27.0",
  "tomli>=2.0.0; python_version < '3.11'",
  "tomli-w>=1.0.0",
  "boto3>=1.34.0",
]

[project.optional-dependencies]
worker = ["mlx-audio>=0.5.0", "kokoro>=0.9.0", "torch>=2.0.0", "soundfile>=0.12.0"]
dev = [
  "behave>=1.2.6",
  "pytest>=8.0",
  "ruff>=0.4.0",
  "black>=24.0",
  "build>=1.2.2",
  "python-semantic-release>=10.5.3",
  "moto>=5.0.0",
]

[project.scripts]
auritus = "auritus.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
# B008: typer.Option() in defaults is the standard Typer pattern, not a bug

[tool.ruff.lint]
# B008: typer.Option() in defaults is the standard Typer pattern, not a bug
# F401: behave step files use cross-step imports that ruff sees as unused
ignore = ["B008", "F401"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.semantic_release]
allow_zero_version = true
build_command = "python -m build"
commit_parser = "conventional"
upload_to_pypi = true
upload_to_vcs_release = true
version_toml = [
  "pyproject.toml:project.version",
]
version_variables = [
  "src/auritus/__init__.py:__version__",
]

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
