name: Build and push worker image

on:
  push:
    branches: [main]
    paths:
      - worker-image/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::335163751677:role/auritus-worker-image-build
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: 335163751677

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: worker-image
          push: true
          tags: |
            335163751677.dkr.ecr.us-east-1.amazonaws.com/auritus-worker:latest
            335163751677.dkr.ecr.us-east-1.amazonaws.com/auritus-worker:${{ github.sha }}
